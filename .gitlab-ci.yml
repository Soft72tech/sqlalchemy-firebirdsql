stages:  
  - lint 
  - format
  - test
  - publish  

variables:  
  PYTHON_VERSION: "3.13"  
  UV_VERSION: "0.5.5"  
  UV_PUBLISH_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"  
  UV_PUBLISH_USERNAME: "gitlab-ci-token"  
  UV_PUBLISH_PASSWORD: "${CI_JOB_TOKEN}"  
  UV_INSECURE_HOST: "git.soft72.ru"
  UV_CACHE_DIR: .uv-cache 
  UV_SYSTEM_PYTHON: 1
  UV_COMPILE_BYTECODE: 1
  UV_LINK_MODE: copy

.base_ruff:
  stage: build
  tags: [docker]
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:0.12.9-alpine
  before_script:
    - cd $CI_PROJECT_DIR
    - ruff --version

lint:
  stage: lint
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab > code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

format:
  stage: format
  extends: .base_ruff
  script:
    - ruff format --diff

test:  
  stage: test  
  tags: [docker]
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-bookworm-slim
  services:
    - name: firebirdsql/firebird:5.0.3
      alias: firebird 
      variables:
        FIREBIRD_ROOT_PASSWORD: root
        FIREBIRD_USER: root
        FIREBIRD_PASSWORD: root
        FIREBIRD_DATABASE: db.fdb
        FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - ${UV_CACHE_DIR}
  script:
    - uv sync --all-extras
    - uv run pytest  --cov-report=term --cov-report=xml:coverage/coverage.xml --cov=sqlalchemy_firebirdsql
  artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: 'coverage/coverage.xml'
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'

publish:  
  stage: publish  
  tags: [docker]
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-bookworm-slim
  script:  
    - PROJECT_VERSION=$(git describe --exact-match --tags)  
    - uvx --from=toml-cli toml set --toml-path=pyproject.toml project.version ${PROJECT_VERSION}  
    - uv build  
    - uv publish dist/*.whl  
  only:
    - tags
