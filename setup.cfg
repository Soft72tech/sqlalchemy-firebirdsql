[tool:pytest]
addopts= --tb native -v -r fxX --maxfail=25 -p no:warnings
python_files=test/*test_*.py

[sqla_testing]
requirement_cls=sqlalchemy_firebirdsql.requirements:Requirements
profile_file=test/profiles.txt

[db]
default=firebird+firebirdsql://root:root@localhost:3050//var/lib/firebird/data/db.fdb
firebird=firebird+firebirdsql://root:root@firebird:3050//var/lib/firebird/data/db.fdb
