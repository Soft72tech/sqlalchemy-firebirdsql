[project]
name = "sqlalchemy-firebirdsql"
version = "0.1.0"
description = "Firebird dialect for SQLAlchemy based on pyfirebirdsql with async support."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.41",
    "firebirdsql>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]

[tool.setuptools.package-dir]
sqlalchemy_firebirdsql = "sqlalchemy_firebirdsql"

[tool.uv]
package = true

[tool.ruff]
src = ["sqlalchemy_firebirdsql"]
lint.isort.lines-after-imports = 2
line-length = 79
