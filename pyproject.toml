[project]
name = "sqlalchemy-firebirdsql"
version = "0.1.1"
description = "Firebird dialect for SQLAlchemy based on pyfirebirdsql with async support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.41",
    "firebirdsql>=1.4.0"
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.4",
]

[tool.setuptools.package-dir]
sqlalchemy_firebirdsql = "sqlalchemy_firebirdsql"

[project.entry-points."sqlalchemy.dialects"]
"firebird" = "sqlalchemy_firebirdsql.firebirdsql:FirebirdDialect_firebirdsql"
"firebird.firebirdsql_async" = "sqlalchemy_firebirdsql.firebirdsql:FirebirdDialectAsync_firebirdsql"
"firebird.firebirdsql" = "sqlalchemy_firebirdsql.firebirdsql:FirebirdDialect_firebirdsql"
"firebirdsql" = "sqlalchemy_firebirdsql.firebirdsql:FirebirdDialect_firebirdsql"

[tool.uv]
package = true

[tool.uv.sources]
sqlalchemy-firebirdsql = { workspace = true }

[tool.ruff]
src = ["sqlalchemy_firebirdsql"]
lint.select = ["E", "F", "I"]
lint.isort.lines-after-imports = 2
line-length = 110
lint.ignore = ["E501"] 

[tool.pyright]
extraPaths = [
    "./.venv/lib/python3.12/site-packages",
    "./.venv/lib/python3.13/site-packages"
]

[tool.pytest.ini_options]
addopts= "--tb native -v -r fxX --maxfail=25 -p no:warnings"
python_files="test/*test_*.py"

[tool.pytest.ini_options.sqla_testing]
requirement_cls="sqlalchemy_firebirdsql.requirements:Requirements"
profile_file="test/profiles.txt"
